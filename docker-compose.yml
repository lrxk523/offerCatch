version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: offercatch-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    container_name: offercatch-app
    restart: unless-stopped
    ports:
      - "7860:7860"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./front:/app/front

volumes:
  redis_data:
